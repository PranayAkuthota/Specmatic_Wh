openapi: 3.1.0

info:
  title: WorkHive Tenants API
  version: 1.0.0
  description: Tenant management for WorkHive SaaS.

paths:
  /tenants:
    post:
      summary: Create a new tenant
      operationId: createTenant
      security:
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Acme Corp

      responses:
        '201':
          description: Tenant created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRequest:
                  value:
                    error: Invalid tenant data

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: Unauthorized access

    get:
      summary: List all tenants
      operationId: listTenants
      security:
        - BearerAuth: []

      responses:
        '200':
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: Unauthorized access

  /tenants/{id}:
    get:
      summary: Get tenant by ID
      operationId: getTenant
      security:
        - BearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1

      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: Unauthorized access

        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tenantNotFound:
                  value:
                    error: Tenant not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Tenant:
      type: object
      required:
        - id
        - name
        - createdAt

      properties:
        id:
          type: integer
          example: 1

        name:
          type: string
          example: Acme Corp

        createdAt:
          type: string
          format: date-time
          example: "2026-06-12T15:00:00Z"

    ErrorResponse:
      type: object
      required:
        - error

      properties:
        error:
          type: string
          example: Unauthorized access

