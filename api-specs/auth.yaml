openapi: 3.1.0

info:
  title: WorkHive Authentication API
  version: 1.0.0

paths:

  /register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - tenantName
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                  minLength: 6
                tenantName:
                  type: string
            examples:
              validRequest:
                value:
                  name: John Doe
                  email: john@example.com
                  password: password123
                  tenantName: Acme

              invalidRequest:
                value:
                  name: Alice Smith

      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  tenant:
                    $ref: '#/components/schemas/Tenant'
              examples:
                validRequest:
                  value:
                    token: jwt-token
                    user:
                      id: 1
                      name: John Doe
                      email: john@example.com
                      role: OWNER
                      tenantId: 1
                    tenant:
                      id: 1
                      name: Acme
                      createdAt: "2026-06-13T12:00:00Z"

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRequest:
                  value:
                    error: Invalid request

  /login:
    post:
      operationId: login

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
            examples:
              validCredentials:
                value:
                  email: john@example.com
                  password: password123

              invalidCredentials:
                value:
                  email: wrong@example.com
                  password: wrongpassword

      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
              examples:
                validCredentials:
                  value:
                    token: jwt-token
                    user:
                      id: 1
                      name: John Doe
                      email: john@example.com
                      role: OWNER
                      tenantId: 1

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  value:
                    error: Invalid email or password
  /profile:
   get:
      operationId: getProfile

      security:
        - BearerAuth: []

      parameters:
        - name: X-Test-Case
          in: header
          required: false
          schema:
            type: string
          examples:
            unauthorized:
              value: unauthorized

      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: Unauthorized

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - OWNER
            - ADMIN
            - MEMBER
        tenantId:
          type: integer

    Tenant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
