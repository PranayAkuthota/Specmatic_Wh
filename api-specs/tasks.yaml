openapi: 3.1.0

info:
  title: WorkHive Tasks API
  version: 1.0.0
  description: Task management for WorkHive SaaS.

paths:
  /tasks:
    post:
      summary: Create a new task
      operationId: createTask
      security:
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - workspaceId
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum:
                    - LOW
                    - MEDIUM
                    - HIGH
                  default: MEDIUM
                status:
                  type: string
                  enum:
                    - TODO
                    - IN_PROGRESS
                    - DONE
                  default: TODO
                dueDate:
                  type:
                    - string
                    - "null"
                  format: date
                workspaceId:
                  type: integer

      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid task data

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized access

    get:
      summary: List tasks
      operationId: listTasks
      security:
        - BearerAuth: []

      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: integer

      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized access

  /tasks/{id}:
    get:
      summary: Get task by ID
      operationId: getTask
      security:
        - BearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized access

        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Task not found

    put:
      summary: Update task
      operationId: updateTask
      security:
        - BearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum:
                    - LOW
                    - MEDIUM
                    - HIGH
                status:
                  type: string
                  enum:
                    - TODO
                    - IN_PROGRESS
                    - DONE
                dueDate:
                  type:
                    - string
                    - "null"
                  format: date

      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid task data

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized access

        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Task not found

    delete:
      summary: Delete task
      operationId: deleteTask
      security:
        - BearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Task deleted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized access

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Forbidden

        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Task not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - priority
        - status
        - workspaceId
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type:
            - string
            - "null"
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
        status:
          type: string
          enum:
            - TODO
            - IN_PROGRESS
            - DONE
        dueDate:
          type:
            - string
            - "null"
          format: date
        workspaceId:
          type: integer

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

