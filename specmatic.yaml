version: 3

dependencies:
  services:
    - service:
        description: WorkHive APIs
        definitions:
          - definition:
              source:
                filesystem:
                  directory: .
              specs:
                - spec:
                    path: ./api-specs/auth.yaml
                - spec:
                    path: ./api-specs/tasks.yaml
                - spec:
                    path: ./api-specs/tenants.yaml
                - spec:
                    path: ./api-specs/workspaces.yaml
