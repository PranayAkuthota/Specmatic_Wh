openapi: 3.1.0

info:
  title: WorkHive Authentication API
  version: 1.0.0
  description: Authentication and profile management for WorkHive SaaS.

paths:
  /register:
    post:
      summary: Register a new user and tenant
      operationId: register

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - tenantName
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                tenantName:
                  type: string
            examples:
              invalidRequest:
                value:
                  name: Alice Smith

      responses:
        '201':
          description: User and Tenant registered successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - user
                  - tenant
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  tenant:
                    $ref: '#/components/schemas/Tenant'

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRequest:
                  value:
                    error: Invalid request

  /login:
    post:
      summary: Login an existing user
      operationId: login

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            examples:
              invalidCredentials:
                value:
                  email: wrong@example.com
                  password: wrongpassword

      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - user
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  value:
                    error: Invalid email or password

  /profile:
    get:
      summary: Get current user profile
      operationId: getProfile

      security:
        - BearerAuth: []

      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          examples:
            unauthorized:
              value: Bearer invalidtoken

      responses:
        '200':
          description: Current user profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: Unauthorized

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
        - role
        - tenantId
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - OWNER
            - ADMIN
            - MEMBER
        tenantId:
          type: integer

    Tenant:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
