version: 3

systemUnderTest:
  service:
    $ref: "#/components/services/workhive"

components:
  sources:
    localFilesystem:
      filesystem:
        directory: ./api-specs
  services:
    workhive:
      description: WorkHive APIs
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/localFilesystem"
            specs:
              - auth.yaml
              - tasks.yaml
              - tenants.yaml
              - workspaces.yaml