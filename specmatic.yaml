version: 3

test:
  resiliencyTests:
    enable: true

dependencies:
  services:
    - service:
        description: WorkHive APIs
        definitions:
          - definition:
              source:
                filesystem:
                  directory: ./api-specs
              specs:
                - spec:
                    path: auth.yaml
                - spec:
                    path: tasks.yaml
                - spec:
                    path: tenants.yaml
                - spec:
                    path: workspaces.yaml